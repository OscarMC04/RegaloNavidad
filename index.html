<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestra Historia — 10 años juntos</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --text: #2c2623;
      --muted: #786e68;
      --accent: #c86d51;
      --accent-hover: #b0593e;
      --line: #e4dcd3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 5rem;
    }
    header {
      text-align: center;
      padding: 3.5rem 1.5rem 2rem;
      max-width: 680px;
      margin: 0 auto;
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    header p {
      color: var(--muted);
      font-size: 1.05rem;
    }
    .toolbar {
      display: none;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }
    .toolbar.active { display: flex; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    button.secondary:hover { background: #efe9e1; }
    button.danger {
      background: #d9534f;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      margin-top: 0.75rem;
    }

    /* Paneles de login y subida */
    .panel {
      max-width: 440px;
      margin: 1rem auto 2.5rem;
      background: var(--card);
      padding: 1.75rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      display: none;
    }
    .panel.active { display: block; }
    .panel h3 { margin-bottom: 0.4rem; font-size: 1.2rem; }
    .panel .subtitle { font-size: 0.9rem; color: var(--muted); margin-bottom: 1.25rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
    .field input, .field textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .status { font-size: 0.85rem; margin-top: 0.75rem; color: var(--accent); }

    /* Línea temporal */
    .timeline {
      position: relative;
      max-width: 760px;
      margin: 1rem auto 0;
      padding: 0 1.5rem;
      display: none;
    }
    .timeline.active { display: block; }
    .timeline::before {
      content: "";
      position: absolute;
      left: 2.2rem;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--line);
    }
    .entry {
      position: relative;
      padding-left: 2.75rem;
      margin-bottom: 2.75rem;
    }
    .entry::before {
      content: "";
      position: absolute;
      left: 0.32rem;
      top: 0.45rem;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 2px var(--accent);
    }
    .entry-date {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }
    .card img {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }
    .card-body { padding: 1.25rem 1.5rem; }
    .card-body h2 { font-size: 1.25rem; margin-bottom: 0.4rem; }
    .card-body p { color: var(--muted); white-space: pre-line; }

    /* Visor pantalla completa */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 100;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
  </style>
</head>
<body>

  <header>
    <h1>Nuestra Historia</h1>
    <p id="header-desc">Álbum privado — Solo para nosotros dos.</p>
    <div id="toolbar" class="toolbar">
      <button class="secondary" onclick="toggleOrder()">Cambiar orden cronológico</button>
      <button onclick="togglePanel('upload-panel')">+ Añadir recuerdo</button>
      <button class="secondary" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <!-- Pantalla de bloqueo / inicio de sesión -->
  <div id="login-panel" class="panel active">
    <h3>Acceso privado</h3>
    <p class="subtitle">Introduce vuestro correo y contraseña para abrir el álbum.</p>
    <div class="field">
      <label>Correo</label>
      <input type="email" id="login-email" placeholder="vuestro@correo.com" />
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()" />
    </div>
    <button onclick="login()" style="width:100%">Entrar a nuestra historia</button>
    <div id="login-status" class="status"></div>
  </div>

  <!-- Panel para subir recuerdo -->
  <div id="upload-panel" class="panel">
    <h3>Guardar un nuevo recuerdo</h3>
    <div class="field">
      <label>Fecha del recuerdo</label>
      <input type="date" id="rec-fecha" />
    </div>
    <div class="field">
      <label>Título</label>
      <input type="text" id="rec-titulo" placeholder="Ej. Nuestro primer viaje juntos" />
    </div>
    <div class="field">
      <label>Historia o anécdota</label>
      <textarea id="rec-desc" rows="3" placeholder="Escribe lo que quieras recordar de este día..."></textarea>
    </div>
    <div class="field">
      <label>Foto</label>
      <input type="file" id="rec-foto" accept="image/*" />
    </div>
    <button id="btn-submit" onclick="subirRecuerdo()">Subir recuerdo</button>
    <div id="upload-status" class="status"></div>
  </div>

  <!-- Contenedor de la línea del tiempo -->
  <main id="timeline" class="timeline"></main>

  <!-- Visor ampliado -->
  <div id="lightbox" class="lightbox" onclick="this.classList.remove('active')">
    <img id="lightbox-img" src="" alt="Recuerdo ampliado" />
  </div>

  <script>
    // ==========================================
    // PEGA AQUÍ TUS DOS CLAVES DE SUPABASE
    // ==========================================
    const SUPABASE_URL = "https://uadckzaydrwvgvprjchs.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_2GAEhz9BKUta6BRhOpeVXg_pjGfLteJ";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let ascending = true;

    db.auth.onAuthStateChange((_event, session) => {
      currentUser = session?.user || null;
      const loginPanel = document.getElementById("login-panel");
      const toolbar = document.getElementById("toolbar");
      const timeline = document.getElementById("timeline");
      const headerDesc = document.getElementById("header-desc");

      if (currentUser) {
        loginPanel.classList.remove("active");
        toolbar.classList.add("active");
        timeline.classList.add("active");
        headerDesc.textContent = "10 años conociéndonos, 6 años caminando juntos y todos los recuerdos que nos quedan por guardar.";
        cargarRecuerdos();
      } else {
        loginPanel.classList.add("active");
        toolbar.classList.remove("active");
        timeline.classList.remove("active");
        timeline.innerHTML = "";
        headerDesc.textContent = "Álbum privado — Solo para nosotros dos.";
      }
    });

    function togglePanel(id) {
      document.getElementById(id).classList.toggle("active");
    }

    function toggleOrder() {
      ascending = !ascending;
      cargarRecuerdos();
    }

    async function login() {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-pass").value;
      const status = document.getElementById("login-status");
      status.textContent = "Verificando acceso...";
      const { error } = await db.auth.signInWithPassword({ email, password });
      status.textContent = error ? "Correo o contraseña incorrectos." : "";
    }

    async function logout() {
      await db.auth.signOut();
      document.getElementById("upload-panel").classList.remove("active");
    }

    function compressImage(file, maxWidth = 1600, quality = 0.82) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let w = img.width, h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            canvas.toBlob((blob) => resolve(blob), "image/jpeg", quality);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function subirRecuerdo() {
      const fecha = document.getElementById("rec-fecha").value;
      const titulo = document.getElementById("rec-titulo").value.trim();
      const descripcion = document.getElementById("rec-desc").value.trim();
      const fileInput = document.getElementById("rec-foto");
      const status = document.getElementById("upload-status");
      const btn = document.getElementById("btn-submit");

      if (!fecha || !titulo || !fileInput.files[0]) {
        status.textContent = "Por favor, completa fecha, título y elige una foto.";
        return;
      }

      btn.disabled = true;
      status.textContent = "Cifrando y subiendo foto...";

      try {
        const compressed = await compressImage(fileInput.files[0]);
        const fileName = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;

        const { error: upErr } = await db.storage
          .from("fotos")
          .upload(fileName, compressed, { contentType: "image/jpeg" });
        if (upErr) throw upErr;

        // Guardamos el nombre privado del archivo en la base de datos
        const { error: insErr } = await db
          .from("recuerdos")
          .insert([{ fecha, titulo, descripcion, imagen_url: fileName }]);
        if (insErr) throw insErr;

        document.getElementById("rec-titulo").value = "";
        document.getElementById("rec-desc").value = "";
        fileInput.value = "";
        status.textContent = "¡Recuerdo guardado!";
        setTimeout(() => {
          status.textContent = "";
          document.getElementById("upload-panel").classList.remove("active");
        }, 1200);
        cargarRecuerdos();
      } catch (err) {
        status.textContent = "Error al subir: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function borrarRecuerdo(id, rawPath) {
      if (!confirm("¿Seguro que quieres eliminar este recuerdo?")) return;
      const fileName = rawPath.split("/").pop();
      await db.storage.from("fotos").remove([fileName]);
      await db.from("recuerdos").delete().eq("id", id);
      cargarRecuerdos();
    }

    function formatearFecha(fechaStr) {
      const [y, m, d] = fechaStr.split("-");
      const meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
      return `${parseInt(d)} ${meses[parseInt(m) - 1]} ${y}`;
    }

    async function cargarRecuerdos() {
      if (!currentUser) return;
      const container = document.getElementById("timeline");
      const { data, error } = await db
        .from("recuerdos")
        .select("*")
        .order("fecha", { ascending });

      if (error) {
        container.innerHTML = `<p style="text-align:center;color:#c86d51">Revisa tus claves de Supabase en el archivo index.html.</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<p style="text-align:center;color:var(--muted)">Aún no hay recuerdos guardados. Pulsa "+ Añadir recuerdo" arriba para subir el primero.</p>`;
        return;
      }

      // Generar enlaces temporales privados (válidos 1 hora) para cada foto
      const itemsConUrl = await Promise.all(data.map(async (item) => {
        const fileName = item.imagen_url.split("/").pop();
        const { data: signed } = await db.storage
          .from("fotos")
          .createSignedUrl(fileName, 3600);
        return {
          ...item,
          rawPath: fileName,
          signedUrl: signed?.signedUrl || ""
        };
      }));

      container.innerHTML = itemsConUrl.map(item => `
        <article class="entry">
          <div class="entry-date">${formatearFecha(item.fecha)}</div>
          <div class="card">
            <img src="${item.signedUrl}" alt="${item.titulo}" loading="lazy" onclick="verFoto('${item.signedUrl}')" />
            <div class="card-body">
              <h2>${item.titulo}</h2>
              ${item.descripcion ? `<p>${item.descripcion}</p>` : ""}
              <button class="danger" onclick="borrarRecuerdo('${item.id}', '${item.rawPath}')">Eliminar</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function verFoto(url) {
      document.getElementById("lightbox-img").src = url;
      document.getElementById("lightbox").classList.add("active");
    }
  </script>
</body>
</html>
